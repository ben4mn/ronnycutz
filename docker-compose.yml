services:
  ronnycutz:
    build: .
    container_name: ronnycutz
    restart: unless-stopped
    ports:
      - "8084:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL}
      - CALENDAR_FEED_TOKEN=${CALENDAR_FEED_TOKEN}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
